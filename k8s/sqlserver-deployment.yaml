apiVersion: apps/v1
kind: Deployment
metadata:
  name: sqlserver
  namespace: fcg-tech-fase-4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver
  template:
    metadata:
      labels:
        app: sqlserver
    spec:
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch

      containers:
        - name: sqlserver
          image: mcr.microsoft.com/azure-sql-edge:latest
          ports:
            - containerPort: 1433

          env:
            - name: ACCEPT_EULA
              value: "Y"

            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sqlserver-secret
                  key: sa-password

          volumeMounts:
            - name: sqlserver-data
              mountPath: /var/opt/mssql

      volumes:
        - name: sqlserver-data
          persistentVolumeClaim:
            claimName: sqlserver-pvc