apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: fcg-tech-fase-4
data:
  POSTGRES_DB: microservices
  init-databases.sh: |
    #!/bin/bash
    set -euo pipefail

    echo "=== Creating databases and users for microservices ==="

    create_role() {
      local role="$1"
      local pwd="$2"
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-EOSQL
        DO \$\$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '${role}') THEN
            CREATE ROLE ${role} WITH LOGIN PASSWORD '${pwd}';
          ELSE
            ALTER ROLE ${role} WITH PASSWORD '${pwd}';
          END IF;
        END
        \$\$;
    EOSQL
    }

    create_database() {
      local db="$1"
      local owner="$2"
      if ! psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -tAc "SELECT 1 FROM pg_database WHERE datname = '${db}'" | grep -q 1; then
        psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "CREATE DATABASE ${db} OWNER ${owner};"
      fi
      psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" -c "GRANT ALL PRIVILEGES ON DATABASE ${db} TO ${owner};"
    }

    create_role "$USERS_DB_USERNAME" "$USERS_DB_PASSWORD"
    create_database "fcg_users_db" "$USERS_DB_USERNAME"

    create_role "$CATALOG_DB_USERNAME" "$CATALOG_DB_PASSWORD"
    create_database "fcg_catalog_db" "$CATALOG_DB_USERNAME"

    create_role "$PAYMENTS_DB_USERNAME" "$PAYMENTS_DB_PASSWORD"
    create_database "fcg_payments_db" "$PAYMENTS_DB_USERNAME"

    echo "=== Databases and users created successfully ==="
