apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: fcg-tech-fase-4
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: POSTGRES_DB
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: USERS_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: users-username
        - name: USERS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: users-password
        - name: CATALOG_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: catalog-username
        - name: CATALOG_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: catalog-password
        - name: PAYMENTS_DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: payments-username
        - name: PAYMENTS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: payments-password
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
        - name: init-scripts
          mountPath: /docker-entrypoint-initdb.d
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER"
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER"
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
      - name: init-scripts
        configMap:
          name: postgres-config
          items:
          - key: init-databases.sh
            path: init-databases.sh

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: fcg-tech-fase-4
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
